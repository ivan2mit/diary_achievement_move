:root{
    --orange:#e28d30; --orange-soft:#f8c27c; --red:#a33924; --green:#4a7a62; --steel:#4e6177;
    --navy:#1a2653; --champagne:#f1edd4; --paper:#faf8ee; --line:#e3dfc6; --text:#4f4c4d;
}
html,body{margin:0;height:100%;background:#0b1027;overflow:hidden}
body{font-family:'Montserrat',sans-serif;color:var(--champagne)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
    background:radial-gradient(ellipse 75% 70% at 50% 42%,#26366f 0%,#1a2653 46%,#111a3e 100%)}
#skywrap,#sky,#fg,#titles{position:absolute;left:0;top:0;width:1920px;height:1080px}
#sky{transform-origin:0 0}
#shade{position:absolute;left:0;right:0;bottom:0;height:330px;background:linear-gradient(rgba(14,21,52,0),rgba(14,21,52,.86) 62%)}
.n{position:absolute;left:0;top:0;width:0;height:0;will-change:transform,opacity}
.n>*{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
.n>.n{transform:none}
.n img{display:block}
.dot{position:absolute;border-radius:50%;background:var(--champagne)}
.glow{border-radius:50%;background:radial-gradient(circle,rgba(248,194,124,.75) 0%,rgba(226,141,48,.28) 38%,rgba(226,141,48,0) 70%)}
.ring{width:120px;height:120px;border-radius:50%;border:3px solid var(--orange-soft);box-sizing:border-box}

/* Титры */
.title{font-family:'Philosopher',serif;font-weight:700;font-size:58px;line-height:1;white-space:nowrap;text-align:center;
    text-shadow:0 2px 18px rgba(10,15,40,.9)}
.title.b{font-size:46px;color:var(--orange-soft)}
.big{font-family:'Philosopher',serif;font-weight:700;font-size:92px;line-height:1.08;text-align:center;white-space:nowrap;
    text-shadow:0 4px 30px rgba(10,15,40,.8)}
.pat{width:1920px;height:96px;background:url('assets/pattern-tile.svg') repeat-x center/auto 96px}

/* Сцена 2: журнал */
.jcard{width:800px;height:500px;border-radius:26px;background:var(--paper);box-shadow:0 30px 80px rgba(6,10,30,.55)}
.jhead{position:absolute;left:36px;top:26px;font-weight:700;font-size:26px;color:var(--navy)}
.jsub{position:absolute;right:36px;top:32px;font-size:18px;color:#8b8779}
.jname{position:absolute;left:36px;height:16px;border-radius:8px;background:var(--line)}
.jcell{width:70px;height:52px;border-radius:8px;background:var(--line);color:var(--text);font-weight:600;font-size:26px;
    display:flex;align-items:center;justify-content:center}

/* Сцена 4: телефон и отметки */
.phone{width:300px;height:610px;border-radius:46px;background:#0c1330;border:4px solid #55688a;box-sizing:border-box;
    box-shadow:0 30px 80px rgba(6,10,30,.6)}
.screen{position:absolute;left:10px;top:10px;right:10px;bottom:10px;border-radius:34px;background:var(--paper);overflow:hidden}
.ptitle{position:absolute;left:0;right:0;top:34px;text-align:center;font-weight:700;font-size:21px;color:var(--navy)}
.psub{position:absolute;left:0;right:0;top:64px;text-align:center;font-size:14px;color:var(--steel)}
.pbtns{position:absolute;left:0;right:0;bottom:26px;height:70px;border-top:1px solid var(--line)}
.scard{width:214px;height:270px;border-radius:24px;background:#fff;border:1px solid var(--line);box-sizing:border-box;
    box-shadow:0 10px 26px rgba(26,38,83,.16);text-align:center}
.scard i{display:block;margin:36px auto 18px;width:96px;height:96px;border-radius:50%;font:700 38px/96px 'Philosopher',serif;font-style:normal;color:#fff}
.scard b{display:block;font-size:24px;color:var(--navy)}
.scard span{display:block;margin-top:10px;font-size:13px;color:#8b8779}
.pbtn{width:54px;height:54px;border-radius:50%;background:#fff;border:1px solid var(--line);box-sizing:border-box;
    display:flex;align-items:center;justify-content:center}
.finger{width:50px;height:50px;border-radius:50%;background:rgba(26,38,83,.28);border:3px solid rgba(26,38,83,.55);box-sizing:border-box}
.mark{width:170px;text-align:center}
.mark .mname{font-size:19px;font-weight:500;color:#aab6d6;white-space:nowrap}
.mark .mpic{height:150px;display:flex;align-items:center;justify-content:center}
.mark .mwhy{font-size:27px;font-weight:600;white-space:nowrap}
.mpts{font-family:'Philosopher',serif;font-weight:700;font-size:70px;color:var(--orange);white-space:nowrap}
.mpts.neg{color:#e0745c}
.mpts.zero{color:#aab6d6}
.badge{padding:14px 30px;border-radius:40px;background:var(--orange);color:var(--navy);font-weight:700;font-size:28px;white-space:nowrap}

/* Сцена 5: планеты */
.diploma{width:96px;height:128px;border-radius:6px;background:var(--paper);box-shadow:0 8px 24px rgba(6,10,30,.5);overflow:hidden}
.diploma i{position:absolute;left:14px;right:14px;top:16px;height:9px;border-radius:5px;background:var(--orange)}
.diploma b{position:absolute;left:14px;right:14px;height:4px;border-radius:2px;background:var(--line)}
.diploma u{position:absolute;right:14px;bottom:14px;width:24px;height:24px;border-radius:50%;background:var(--red)}
.orbit{border-radius:50%;border:1.5px dashed rgba(241,237,212,.26);box-sizing:border-box}
.plabel{white-space:nowrap;font-size:20px;font-weight:500;color:var(--champagne);text-align:center}
.plabel b{font-family:'Philosopher',serif;font-size:36px;color:var(--orange);margin-right:7px}
.plabel span{display:block;font-size:16px;color:var(--orange-soft);margin-top:2px}

/* Сцена 6: созвездие */
.cnt{white-space:nowrap;text-align:center}
.cnt b{display:block;font-family:'Philosopher',serif;font-size:170px;line-height:.9;color:var(--orange)}
.cnt span{font-size:30px;font-weight:500}
.award{--ss:1}
.award svg,.fig svg{position:absolute;left:0;top:0;overflow:visible}
.award img,.fig img{position:absolute}
.award img{transform:translate(-50%,-50%) scale(var(--ss))}
.fig img{transform:translate(-50%,-50%)}
.award polyline{fill:none;stroke:var(--champagne);stroke-width:calc(3.6px*var(--ss));stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.award polyline.thin{stroke-width:calc(2px*var(--ss));opacity:.5}
.fig{position:relative;flex:none}
.fig line{stroke:var(--champagne);stroke-linecap:round;opacity:.85}
.adot{width:7px;height:7px;border-radius:50%;background:var(--champagne);box-shadow:0 0 6px 1px rgba(248,194,124,.6)}
#lines path,#lines line{fill:none;stroke:#f1edd4;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#lines .thin{stroke-width:1.2}
.crow{display:flex;align-items:center;gap:18px;white-space:nowrap;transform:translate(0,-50%)!important}
.crow b{font-size:27px;font-weight:600}
.cico{width:74px;height:70px;display:flex;align-items:center;justify-content:center;flex:none}
.dir{text-align:center;white-space:nowrap;font-size:38px;font-weight:700;line-height:1.2}
.dept{text-align:center;white-space:nowrap;font-size:23px;font-weight:600;color:#e9907a}
.left{text-align:left;transform:translate(0,-50%)!important}
.tag{white-space:nowrap;font-size:14px;font-weight:600;padding:5px 12px;border-radius:14px;background:rgba(241,237,212,.12);border:1px solid rgba(241,237,212,.4)}
.tag b{color:var(--orange-soft)}
.small{white-space:nowrap;font-size:12px;font-weight:500;color:#c9d2ec}
#lines{position:absolute;left:0;top:0;overflow:visible}

/* Сцена 7: направления */
.book,.flower{display:block;overflow:visible}
.score{text-align:center;white-space:nowrap}
.score b{display:block;font-family:'Philosopher',serif;font-size:112px;line-height:1;color:var(--orange)}
.score span{font-size:26px;font-weight:500}

/* Сцена 8: подарки */
.step{width:92px;height:92px;border-radius:50%;background:var(--navy);border:3px solid var(--champagne);box-sizing:border-box;
    display:flex;align-items:center;justify-content:center}
.cap{text-align:center;white-space:nowrap}
.cap b{display:block;font-size:34px;font-weight:700}
.cap span{display:block;margin-top:8px;font-size:21px;font-weight:500;color:#c9d2ec}
.track{height:4px;border-radius:2px;background:var(--champagne);transform:none!important;left:0!important;top:-2px!important}
.gbody{width:112px;height:84px;border-radius:8px;background:var(--orange);
    background-image:linear-gradient(90deg,transparent 44%,var(--champagne) 44%,var(--champagne) 56%,transparent 56%)}
.glid{width:130px;height:30px;border-radius:8px;background:var(--orange-soft);
    background-image:linear-gradient(90deg,transparent 45%,var(--champagne) 45%,var(--champagne) 55%,transparent 55%)}

/* Панель управления (в ролик не попадает) */
#ui{position:fixed;left:0;right:0;bottom:0;padding:14px 18px;display:flex;gap:12px;align-items:center;font-size:13px;
    background:linear-gradient(transparent,rgba(5,8,24,.9));transition:opacity .3s;z-index:10}
#ui.hide{opacity:0;pointer-events:none}
#ui button{font:inherit;color:var(--champagne);background:rgba(241,237,212,.12);border:1px solid rgba(241,237,212,.3);
    border-radius:8px;padding:6px 10px;cursor:pointer}
#ui button:hover{background:rgba(241,237,212,.22)}
#ui input{flex:1;accent-color:var(--orange)}
#ui .tm{width:92px;text-align:right;font-variant-numeric:tabular-nums}
body.clean #ui,body.clean #start{display:none}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:11;font:700 28px 'Montserrat',sans-serif;
    color:var(--navy);background:var(--orange);border:0;border-radius:40px;padding:18px 40px;cursor:pointer}
#start.off{display:none}
body.clean{cursor:none}
</style>

<div id="stage">
    <div id="skywrap"><div id="sky"><svg id="lines" width="1920" height="1080"></svg></div></div>
    <div id="shade"></div>
    <div id="fg"></div>
    <div id="titles"></div>
</div>
<audio id="music" src="assets/music.m4a" preload="auto"></audio>
<button id="start">▶ Смотреть</button>
<div id="ui">
    <button id="play" title="Пробел">❚❚</button>
    <input id="seek" type="range" min="0" max="98" step="0.01" value="0">
    <span class="tm" id="tm">0:00 / 1:38</span>
    <button id="mute" title="Звук (M)">♪</button>
    <span id="chips"></span>
</div>

<script src="shapes.js"></script>
<script>
'use strict';
/* Ролик собран как функция от времени: любой кадр можно получить через window.seek(t).
   Поэтому его можно и смотреть в браузере, и покадрово выгружать в видео. */
const DUR = 98;
const $ = (id) => document.getElementById(id);
const sky = $('sky'), skywrap = $('skywrap'), fg = $('fg'), titles = $('titles');
const SH = window.SHAPES;

// ---------- движок ----------
const E = {
    lin: (p) => p,
    in: (p) => p * p * p,
    out: (p) => 1 - Math.pow(1 - p, 3),
    io: (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    back: (p) => 1 + 2.4 * Math.pow(p - 1, 3) + 1.4 * Math.pow(p - 1, 2),
};
const items = [], fxs = [], lives = [];
function reg(el) {
    if (!el._m) { el._m = { base: { x: 0, y: 0, s: 1, r: 0, o: 1 }, tr: {} }; items.push(el); }
    return el._m;
}
function set(el, props) { Object.assign(reg(el).base, props); return el; }
function to(el, t0, d, props, ease = E.io) {
    const m = reg(el);
    for (const k in props) {
        const segs = m.tr[k] || (m.tr[k] = []);
        const last = segs[segs.length - 1];
        if (last && t0 < last.t1 - 1e-6) console.warn('перекрытие дорожек', k, t0, el);
        segs.push({ t0, t1: t0 + d, from: last ? last.to : m.base[k], to: props[k], ease });
    }
    return el;
}
function val(m, k, t) {
    let v = m.base[k];
    const segs = m.tr[k];
    if (!segs) return v;
    for (const s of segs) {
        if (t >= s.t1) v = s.to;
        else { if (t > s.t0) v = s.from + (s.to - s.from) * s.ease((t - s.t0) / (s.t1 - s.t0)); break; }
    }
    return v;
}
function fx(t0, d, fn, ease = E.io) { fxs.push({ t0, d, fn, ease, last: -1 }); }
function step(t0, fn) { fx(t0, 0, (p) => fn(p >= 1), E.lin); }
function live(fn) { lives.push(fn); }
function applyDom(el, v) {
    const o = v.o < 0 ? 0 : v.o > 1 ? 1 : v.o;
    if (o < .004) { if (!el._hid) { el.style.visibility = 'hidden'; el._hid = true; } return; }
    if (el._hid) { el.style.visibility = ''; el._hid = false; }
    el.style.opacity = o;
    el.style.transform = `translate(${v.x.toFixed(2)}px,${v.y.toFixed(2)}px) rotate(${v.r.toFixed(2)}deg) scale(${v.s.toFixed(4)})`;
}
function render(t) {
    for (const el of items) {
        const m = el._m, v = {};
        for (const k in m.base) v[k] = val(m, k, t);
        if (el.apply) el.apply(v); else applyDom(el, v);
    }
    for (const f of fxs) {
        let p = f.d ? (t - f.t0) / f.d : (t >= f.t0 ? 1 : 0);
        p = p < 0 ? 0 : p > 1 ? 1 : p;
        if (p !== f.last) { f.last = p; f.fn(f.ease(p)); }
    }
    for (const fn of lives) fn(t);
}

// ---------- помощники ----------
function node(parent, html, x = 0, y = 0, extra) {
    const el = document.createElement('div');
    el.className = 'n';
    el.innerHTML = html;
    parent.appendChild(el);
    return set(el, Object.assign({ x, y }, extra));
}
const img = (name, w) => `<img src="assets/${name}" style="width:${w}px" alt="">`;
const pop = (el, t, d = .6) => { to(el, t, d, { s: 1 }, E.back); to(el, t, d * .5, { o: 1 }, E.out); return el; };
const show = (el, t, d = .6) => to(el, t, d, { o: 1 }, E.out);
const hide = (el, t, d = .5) => to(el, t, d, { o: 0 }, E.in);
const ping = (el, t, k = 1.35) => { to(el, t, .18, { s: k }, E.out); to(el, t + .18, .42, { s: 1 }, E.io); };
function title(t0, t1, text, row = 0) {
    const y = row ? 974 : 900;
    const el = node(titles, `<div class="title${row ? ' b' : ''}">${text}</div>`, 960, y + 22, { o: 0 });
    to(el, t0, .7, { o: 1, y }, E.out);
    to(el, t1 - .5, .5, { o: 0, y: y - 14 }, E.in);
}
let seed = 20261009;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

// ---------- небо и камера ----------
// Камера показывает точку мира (x, y) в точке экрана (960, 460) с масштабом s.
const HOME = { x: 960, y: 400 };
const cam = { apply(v) { sky.style.transform = `translate(${(960 - v.x * v.s).toFixed(2)}px,${(460 - v.y * v.s).toFixed(2)}px) scale(${v.s.toFixed(4)})`; } };
const CAM4 = { x: 1044, y: 400, s: 1.9 };
const CAM6 = { x: 435, y: 205, s: 1.85 };
const w2s = (c, x, y) => [960 + (x - c.x) * c.s, 460 + (y - c.y) * c.s];

const twinkles = [];
for (let i = 0; i < 230; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    const size = 1.2 + rnd() * 2.2, base = .18 + rnd() * .5;
    d.style.cssText = `left:${-150 + rnd() * 2220}px;top:${-120 + rnd() * 1320}px;width:${size}px;height:${size}px;opacity:${base}`;
    sky.insertBefore(d, sky.firstChild);
    if (i % 3 === 0) twinkles.push({ d, base, w: .8 + rnd() * 2.2, ph: rnd() * 6.28 });
}
live((t) => { for (const k of twinkles) k.d.style.opacity = (k.base * (.55 + .45 * Math.sin(t * k.w + k.ph))).toFixed(3); });

const PLANETS = [
    ['mercury', 'Меркурий', 3, 60, -10], ['venus', 'Венера', 5, 66, 140], ['earth', 'Земля', 10, 84, 20], ['mars', 'Марс', 15, 70, 100],
    ['jupiter', 'Юпитер', 35, 104, -25], ['saturn', 'Сатурн', 30, 140, 140], ['uranus', 'Уран', 25, 84, 45], ['neptune', 'Нептун', 20, 84, 28],
].map(([file, name, pts, size, a], i) => {
    const rx = 190 + i * 85, ry = 110 + i * 38, rad = a * Math.PI / 180;
    return { file, name, pts, size, rx, ry, x: HOME.x + rx * Math.cos(rad), y: HOME.y + ry * Math.sin(rad) };
});
const MERC = PLANETS[0];

set(cam, { x: HOME.x, y: HOME.y, s: 2.6 });
to(cam, 0, 20, { s: 2.3 }, E.lin);
to(cam, 20, 2, CAM4);
to(cam, 36.2, 2, { x: MERC.x, y: MERC.y, s: 2.4 });
to(cam, 40.4, 3, { x: HOME.x, y: HOME.y, s: 1.15 });
to(cam, 43.4, 5, { s: 1.12 }, E.lin);
to(cam, 48.4, 2.2, CAM6);
to(cam, 59.1, 1.2, { x: 242, y: 205, s: 1.5 });
to(cam, 63.4, 2, { x: HOME.x, y: HOME.y, s: 1.25 });
to(cam, 65.4, 22.4, { s: 1.15 }, E.lin);
to(cam, 87.8, 3.2, { x: 960, y: 460, s: 1 });

set(skywrap, {});
skywrap.apply = (v) => { skywrap.style.opacity = v.o; };
to(skywrap, 63.6, 1.4, { o: .2 });
to(skywrap, 87.6, 2.2, { o: 1 });

// ---------- сцена 1. Хук (0:00–0:07) ----------
const glow0 = node(sky, '<div class="glow" style="width:260px;height:260px"></div>', HOME.x, HOME.y, { o: 0, s: .3 });
const star0 = node(sky, img('star.webp', 64), HOME.x, HOME.y, { o: 0, s: 0 });
pop(star0, 1.0, .9);
to(glow0, 1.0, 1.4, { o: .9, s: 1 }, E.out);
live((t) => { glow0.firstChild.style.opacity = (.78 + .22 * Math.sin(t * 2.1)).toFixed(3); });
title(0.9, 6.6, 'Каждое занятие — шаг вперёд.');
title(3.5, 6.6, 'Как его увидеть?', 1);

// ---------- сцена 2. Проблема (0:07–0:15) ----------
const jcard = node(fg, `<div class="jcard"><div class="jhead">Журнал группы</div><div class="jsub">октябрь</div>${
    [0, 1, 2, 3, 4].map((j) => `<div class="jname" style="top:${142 + j * 66}px;width:${110 + (j * 37) % 60}px"></div>`).join('')}</div>`,
    960, 430, { o: 0, s: .94 });
show(jcard, 7.2, .7); to(jcard, 7.2, .7, { s: 1 }, E.out);

// значок созвездия-награды в общем стиле: главные звёзды объёмные оранжевые, остальные — малые цветные
function figure(pts, segs, big, box, sp, lw = 1.6) {
    const names = Object.keys(pts), xs = names.map((n) => pts[n][0]), ys = names.map((n) => pts[n][1]);
    const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0, h = Math.max(...ys) - y0;
    const k = Math.min((box - sp * 2) / w, (box - sp * 2) / h), ox = (box - w * k) / 2, oy = (box - h * k) / 2;
    const P = (n) => [ox + (pts[n][0] - x0) * k, oy + (pts[n][1] - y0) * k];
    const star = (n, i) => (big.includes(n) ? ['star_puffy', sp * 2] : [i % 2 ? 'star_green' : 'star_blue', sp]);
    return `<div class="fig" style="width:${box}px;height:${box}px"><svg width="${box}" height="${box}">${
        segs.map(([a, b]) => `<line x1="${P(a)[0]}" y1="${P(a)[1]}" x2="${P(b)[0]}" y2="${P(b)[1]}" stroke-width="${lw}"/>`).join('')}</svg>${
        names.filter((n) => !big.includes(n)).concat(big).map((n, i) => `<img src="assets/${star(n, i)[0]}.webp" alt="" style="left:${P(n)[0]}px;top:${P(n)[1]}px;width:${star(n, i)[1]}px">`).join('')}</div>`;
}

    d4: [.559, .439], d5: [.475, .373], d6: [.413, .342], d7: [.337, .37], d8: [.26, .54], d9: [.257, .711], d10: [.222, .792] };
const LEO = { tail: [.248, .582], hip: [.39, .442], back: [.465, .432], belly: [.41, .531], mane: [.635, .4], n1: [.65, .336], n2: [.741, .282],

    leo: (box, sp, lw) => figure(LEO, [['tail', 'hip'], ['tail', 'belly'], ['hip', 'belly'], ['belly', 'reg'], ...chainSegs(['hip', 'back', 'mane', 'n1', 'n2', 'n3']), ...chainSegs(['mane', 'chest', 'reg'])], ['reg', 'mane', 'tail', 'hip'], box, sp, lw),
    minor: (box, sp, lw) => figure(MINOR, [['a', 'b']], ['b'], box, sp, lw),

const SCENES = [[0, 'Хук'], [7, 'Проблема'], [15, 'Название'], [20, 'Звёзды'], [37, 'Планеты'], [49, 'Созвездия'], [64, 'Один счёт'], [80, 'Подарки'], [88, 'Финал']];
const stage = $('stage'), ui = $('ui'), seekEl = $('seek'), tm = $('tm'), playBtn = $('play');
let now = 0, playing = false, lastTs = 0;
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function fit() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%,-50%) scale(${k})`;
}
function draw() {
    render(now);
    seekEl.value = now; tm.textContent = `${fmt(now)} / ${fmt(DUR)}`;
    playBtn.textContent = playing ? '❚❚' : (now >= DUR ? '↺' : '▶');
}
function tick(ts) {
    if (!playing) return;
    now = Math.min(DUR, now + Math.min(.1, (ts - lastTs) / 1000)); lastTs = ts;
    if (now >= DUR) { playing = false; music.pause(); }
    else if (Math.abs(music.currentTime - now) > .3 && !music.paused) music.currentTime = now;
    draw();
    if (playing) requestAnimationFrame(tick);
}
const music = $('music');
function play() {
    if (now >= DUR) now = 0;
    playing = true; lastTs = performance.now(); requestAnimationFrame(tick); draw();
    $('start').classList.add('off');
    music.currentTime = now; music.play().catch(() => {});
}
function pause() { playing = false; music.pause(); draw(); }
window.seek = (t) => { playing = false; music.pause(); now = Math.max(0, Math.min(DUR, t)); draw(); };
$('start').onclick = play;
$('mute').onclick = () => { music.muted = !music.muted; $('mute').style.opacity = music.muted ? .4 : 1; };
playBtn.onclick = () => (playing ? pause() : play());
seekEl.oninput = () => window.seek(+seekEl.value);
SCENES.forEach(([t, name], i) => {
    const b = document.createElement('button');
    b.textContent = i + 1; b.title = name; b.style.marginLeft = '4px';
    b.onclick = () => { window.seek(t); play(); };
    $('chips').appendChild(b);
});
addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'ArrowRight') window.seek(now + (e.shiftKey ? 5 : 1));
    if (e.code === 'ArrowLeft') window.seek(now - (e.shiftKey ? 5 : 1));
    if (e.code === 'KeyH') document.body.classList.toggle('clean');
    if (e.code === 'KeyM') $('mute').click();
    if (e.code === 'KeyF') (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
});
let idle;
addEventListener('mousemove', () => { ui.classList.remove('hide'); clearTimeout(idle); idle = setTimeout(() => playing && ui.classList.add('hide'), 2500); });
addEventListener('resize', fit);
const q = new URLSearchParams(location.search);
if (q.has('clean')) document.body.classList.add('clean');
fit();
// Звук браузер разрешает только после нажатия, поэтому ролик ждёт кнопку «Смотреть» или пробел.
document.fonts.ready.then(() => { window.ready = true; if (q.has('t')) window.seek(+q.get('t')); });
draw();
